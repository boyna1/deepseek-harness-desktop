<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <title>DeepSeek Harness</title>
  <style>
    html, body { margin: 0; height: 100%; font-family: "Segoe UI", "Microsoft YaHei", sans-serif; }
    #toolbar {
      display: flex; align-items: center; gap: 10px;
      padding: 7px 14px; background: #1e1e2e; color: #e5e5e5;
      border-bottom: 1px solid #34344a; user-select: none;
    }
    #toolbar .title { font-weight: 600; font-size: 14px; margin-right: 4px; }
    #status {
      font-size: 12px; padding: 2px 10px; border-radius: 10px;
      background: #8a2f2f; color: #fff; white-space: nowrap;
    }
    #status.on { background: #1f7a3d; }
    #toolbar button {
      padding: 4px 12px; border: 1px solid #45455f; background: #2a2a3a;
      color: #e5e5e5; border-radius: 4px; cursor: pointer; font-size: 13px;
    }
    #toolbar button:hover { background: #3a3a4e; }
    #toolbar button:disabled { opacity: 0.5; cursor: default; }
    #view { position: absolute; top: 40px; left: 0; right: 0; bottom: 0; }
    #overlay {
      position: absolute; top: 40px; left: 0; right: 0; bottom: 0;
      display: flex; align-items: center; justify-content: center;
      background: #1e1e2e; color: #a0a0b0; font-size: 15px; z-index: 10;
    }
    #overlay.hidden { display: none; }
  </style>
</head>
<body>
  <div id="toolbar">
    <span class="title">DeepSeek Harness</span>
    <span id="status">状态：检查中…</span>
    <button id="btn-restart">重启服务</button>
    <button id="btn-start">启动服务</button>
    <button id="btn-browser">浏览器打开</button>
  </div>
  <div id="overlay">正在启动 DeepSeek Harness 服务…</div>
  <webview id="view" src="http://127.0.0.1:3080"></webview>

  <script>
    const status = document.getElementById('status');
    const view = document.getElementById('view');
    const overlay = document.getElementById('overlay');
    const btnRestart = document.getElementById('btn-restart');
    const btnStart = document.getElementById('btn-start');

    function render(s) {
      if (s && s.running) {
        status.textContent = '运行中 · PID ' + s.pid;
        status.className = 'on';
        overlay.classList.add('hidden');
      } else {
        status.textContent = '未运行';
        status.className = '';
      }
    }

    function reloadView() {
      try { if (view && view.reload) view.reload(); } catch (e) {}
    }

    let lastRunning = false;
    async function refresh() {
      let s = { running: false };
      try { s = await window.dsh.status(); } catch (e) {}
      render(s);
      if (s.running && !lastRunning) reloadView(); // 服务从停止→运行，重载页面
      lastRunning = s.running;
    }

    btnRestart.onclick = async () => {
      btnRestart.disabled = true;
      status.textContent = '重启中…';
      status.className = '';
      try { await window.dsh.restart(); } catch (e) {}
      setTimeout(() => { reloadView(); refresh(); btnRestart.disabled = false; }, 800);
    };

    btnStart.onclick = async () => {
      btnStart.disabled = true;
      status.textContent = '启动中…';
      try { await window.dsh.start(); } catch (e) {}
      setTimeout(() => { reloadView(); refresh(); btnStart.disabled = false; }, 800);
    };

    document.getElementById('btn-browser').onclick = () => window.dsh.openBrowser();

    window.dsh.onReady((ok) => {
      refresh();
      if (ok) reloadView();
    });

    setInterval(refresh, 3000);
    refresh();
  </script>
</body>
</html>
